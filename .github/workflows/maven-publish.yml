# Publish the jar (plus sources and javadoc) to GitHub Packages.
#
# NOT WIRED UP YET, on purpose:
#   * it only runs when launched by hand, or when a GitHub release is published;
#   * it needs the -Pgithub-packages profile of the pom, which is the only place
#     <distributionManagement> lives, so a plain `mvn deploy` never targets this;
#   * it needs the parent chain (org.gjs:gjs-parent ->
#     org.gjs.java:gjs-java-base-parent) to be published first.
#
# Bear in mind that GitHub Packages requires authentication even to READ a
# public package: whoever consumes the artifact needs a token in their
# settings.xml. Maven Central is the destination for the real release.
name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Writes a settings.xml with a <server> called 'github', which is the
          # id the <distributionManagement> in the pom points at.
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Deploy
        # Same profiles the maven-release-plugin passes in the pom: they attach
        # the sources and javadoc jars.
        run: mvn -B -ntp -Pgithub-packages,attach-sources,attach-javadoc deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
