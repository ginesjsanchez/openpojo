# Build and test on every push.
#
# NOTE: this cannot go green until the parent chain
# (org.gjs:gjs-parent -> org.gjs.java:gjs-java-base-parent) is published to a
# repository the runner can reach. Until then the build stops at
# "Non-resolvable parent POM". That is why the automatic triggers below are
# commented out and only the manual one is active: uncomment them once the
# parents are published.
name: Build

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  # Only needed if the parent poms end up in GitHub Packages, which requires
  # authentication even to read. See the settings.xml step below.
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Writes a settings.xml with a <server> called 'github'. Drop this
          # (and the env block below) if the parents are read from Maven Central.
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Build and test
        run: mvn -B -ntp verify
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
